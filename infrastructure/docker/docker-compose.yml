version: "3.8"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS}
      - NODE_ENV=${NODE_ENV}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER}
    depends_on:
      - db
    volumes:
      - api-logs:/app/logs

  web:
    build:
      context: ./apps/web
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - api

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=ethio_lottery
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-sql:/docker-entrypoint-initdb.d

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: infrastructure/docker/Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - api-logs:/var/log/api-logs

volumes:
  postgres-data:
  api-logs: